spring.application.name=mochimexa

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mochimexa}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# En deploy configura JWT_SECRET con una llave Base64 propia de al menos 256 bits.
security.jwt.secret=${JWT_SECRET:bWktbGxhdmUtc2VjcmV0YS1wYXJhLWRlbW8tamF2YS1zcHJpbmctc2VjdXJpdHktand0LTIwMjY=}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Lista separada por comas. En producción incluye el origen HTTPS exacto del frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8765,http://127.0.0.1:8765}
